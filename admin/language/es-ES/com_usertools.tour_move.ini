COM_USERTOOLS_TOUR_MOVE_TITLE="User Tools: mover grupos"
COM_USERTOOLS_TOUR_MOVE_DESC="Cambia el grupo padre de varios grupos a la vez, con todos sus subgrupos y miembros. Solo para superusuarios."
COM_USERTOOLS_TOUR_MOVE_RULES_TITLE="Qué se hereda"
COM_USERTOOLS_TOUR_MOVE_RULES_DESC="Al cambiar de padre, un grupo hereda otros permisos y niveles de acceso. Se rechazan los movimientos que cambiarían el acceso a la administración o los permisos de superusuario."
COM_USERTOOLS_TOUR_MOVE_GROUPS_TITLE="Grupos que se mueven"
COM_USERTOOLS_TOUR_MOVE_GROUPS_DESC="Marca los grupos. Cada uno se mueve con sus subgrupos; la raíz y los grupos de superusuarios no se pueden mover."
COM_USERTOOLS_TOUR_MOVE_TARGET_TITLE="Nuevo padre"
COM_USERTOOLS_TOUR_MOVE_TARGET_DESC="El grupo del que colgarán los grupos marcados."
COM_USERTOOLS_TOUR_MOVE_ACTIONS_TITLE="Revisar antes de mover"
COM_USERTOOLS_TOUR_MOVE_ACTIONS_DESC="La revisión muestra los niveles de acceso que gana y pierde cada grupo, sin cambiar nada. Cada movimiento queda en el registro de acciones."
