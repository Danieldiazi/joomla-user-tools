COM_USERTOOLS_TOUR_INACTIVE_TITLE="User Tools: revisar usuarios inactivos"
COM_USERTOOLS_TOUR_INACTIVE_DESC="Busca las cuentas que llevan un tiempo sin acceder y bloquea las que elijas. Se pueden desbloquear después con «Deshacer bloqueos»."
COM_USERTOOLS_TOUR_INACTIVE_STEPS_TITLE="Tres pasos"
COM_USERTOOLS_TOUR_INACTIVE_STEPS_DESC="Indicas el plazo, eliges las cuentas en la revisión y ves el resultado. Buscar no cambia nada."
COM_USERTOOLS_TOUR_INACTIVE_PERIOD_TITLE="Plazo sin acceder"
COM_USERTOOLS_TOUR_INACTIVE_PERIOD_DESC="Número de días desde el último acceso. Marca la casilla si también quieres incluir las cuentas que nunca han accedido."
COM_USERTOOLS_TOUR_INACTIVE_EXCLUSIONS_TITLE="Exclusiones"
COM_USERTOOLS_TOUR_INACTIVE_EXCLUSIONS_DESC="Esta herramienta tiene sus propias exclusiones. Los superusuarios y tu propia cuenta están siempre protegidos."
COM_USERTOOLS_TOUR_INACTIVE_ACTIONS_TITLE="Buscar y revisar"
COM_USERTOOLS_TOUR_INACTIVE_ACTIONS_DESC="La búsqueda muestra los candidatos para que marques cuáles bloquear. A partir del umbral de Opciones tendrás que escribir el número de cuentas. Cada bloqueo cierra las sesiones de la cuenta y queda en el registro de acciones."
