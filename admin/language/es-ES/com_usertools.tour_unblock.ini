COM_USERTOOLS_TOUR_UNBLOCK_TITLE="User Tools: deshacer bloqueos"
COM_USERTOOLS_TOUR_UNBLOCK_DESC="Desbloquea las cuentas de una tanda de bloqueos: una ejecución de la tarea programada o una revisión manual. Antes de cambiar nada verás qué cuentas se pueden desbloquear."
COM_USERTOOLS_TOUR_UNBLOCK_STEPS_TITLE="Tres pasos"
COM_USERTOOLS_TOUR_UNBLOCK_STEPS_DESC="Eliges la tanda, revisas sus cuentas y ves el resultado."
COM_USERTOOLS_TOUR_UNBLOCK_RULES_TITLE="Qué cuentas se ofrecen"
COM_USERTOOLS_TOUR_UNBLOCK_RULES_DESC="Solo las que siguen bloqueadas y no han cambiado desde la tanda. Si no eres superusuario, no podrás desbloquear cuentas con acceso a la administración."
COM_USERTOOLS_TOUR_UNBLOCK_BATCHES_TITLE="Tandas recientes"
COM_USERTOOLS_TOUR_UNBLOCK_BATCHES_DESC="Pulsa «Revisar» en una tanda para ver sus cuentas. Revisar no desbloquea nada: lo harás después, eligiendo las cuentas y confirmando."
