COM_USERTOOLS_TOUR_ANONYMIZE_TITLE="User Tools: anonimizar cuentas"
COM_USERTOOLS_TOUR_ANONYMIZE_DESC="Sustituye los datos personales de las cuentas que elijas sin eliminarlas, para conservar su contenido. Es permanente."
COM_USERTOOLS_TOUR_ANONYMIZE_WARNING_TITLE="Qué cambia"
COM_USERTOOLS_TOUR_ANONYMIZE_WARNING_DESC="Lee qué datos se sustituyen y cuáles se conservan. No se puede deshacer."
COM_USERTOOLS_TOUR_ANONYMIZE_SOURCE_TITLE="Elegir las cuentas"
COM_USERTOOLS_TOUR_ANONYMIZE_SOURCE_DESC="Elige una forma: una lista de nombres, las cuentas sin acceder desde un plazo o los miembros de un grupo."
COM_USERTOOLS_TOUR_ANONYMIZE_EXCLUSIONS_TITLE="Exclusiones"
COM_USERTOOLS_TOUR_ANONYMIZE_EXCLUSIONS_DESC="Cuentas y grupos que nunca se anonimizan con esta herramienta. Los superusuarios y tu propia cuenta están siempre protegidos."
COM_USERTOOLS_TOUR_ANONYMIZE_ACTIONS_TITLE="Buscar y confirmar"
COM_USERTOOLS_TOUR_ANONYMIZE_ACTIONS_DESC="La búsqueda no cambia nada. En la revisión marcas las cuentas y escribes siempre su número para confirmar. Cada anonimización cierra las sesiones de la cuenta y queda en el registro de acciones."
