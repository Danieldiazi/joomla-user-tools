COM_USERTOOLS_TOUR_BULKCREATE_TITLE="User Tools: alta masiva de usuarios"
COM_USERTOOLS_TOUR_BULKCREATE_DESC="Crea nuevas cuentas por código de usuario, con nombre, correo y grupo opcionales. No modifica ni bloquea cuentas existentes."
COM_USERTOOLS_TOUR_BULKCREATE_RULES_TITLE="Solo crea cuentas nuevas"
COM_USERTOOLS_TOUR_BULKCREATE_RULES_DESC="La revisión permite seleccionar las altas. No se bloquean usuarios que falten en la lista y las cuentas ya existentes se omiten."
COM_USERTOOLS_TOUR_BULKCREATE_LIST_TITLE="Introducir cuentas"
COM_USERTOOLS_TOUR_BULKCREATE_LIST_DESC="Una línea por cuenta: usuario;nombre;correo;grupo. Solo usuario es obligatorio. Los vacíos se completan en la revisión: nombre igual al usuario, grupo Registrados y correo manual o generado con un dominio."
COM_USERTOOLS_TOUR_BULKCREATE_ACTIONS_TITLE="Revisión previa obligatoria"
COM_USERTOOLS_TOUR_BULKCREATE_ACTIONS_DESC="El botón prepara la revisión sin modificar cuentas. Allí podrás marcar filas, revisar los correos y elegir entre enlace, contraseña temporal y SSO."
