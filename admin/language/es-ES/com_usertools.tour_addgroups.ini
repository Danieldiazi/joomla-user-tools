COM_USERTOOLS_TOUR_ADDGROUPS_TITLE="User Tools: añadir cuentas a grupos"
COM_USERTOOLS_TOUR_ADDGROUPS_DESC="Añade cuentas existentes a uno o varios grupos sin quitarlas de los que ya tienen."
COM_USERTOOLS_TOUR_ADDGROUPS_RULES_TITLE="Protecciones"
COM_USERTOOLS_TOUR_ADDGROUPS_RULES_DESC="Nunca se asignan grupos con acceso a la administración ni se modifican superusuarios, cuentas con acceso administrativo o tu propia cuenta."
COM_USERTOOLS_TOUR_ADDGROUPS_ACCOUNTS_TITLE="Cuentas y grupos"
COM_USERTOOLS_TOUR_ADDGROUPS_ACCOUNTS_DESC="Elige un grupo para toda la lista o escribe pares usuario;grupo, uno por línea. El grupo se indica por su ID o su ruta completa."
COM_USERTOOLS_TOUR_ADDGROUPS_ACTIONS_TITLE="Revisar antes de aplicar"
COM_USERTOOLS_TOUR_ADDGROUPS_ACTIONS_DESC="La revisión muestra qué se añadirá y qué se rechaza, sin cambiar nada. Cada pertenencia añadida cierra las sesiones de la cuenta y queda en el registro de acciones."
