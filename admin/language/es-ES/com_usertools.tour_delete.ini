COM_USERTOOLS_TOUR_DELETE_TITLE="User Tools: eliminar usuarios inactivos"
COM_USERTOOLS_TOUR_DELETE_DESC="Elimina las cuentas inactivas que elijas. Es permanente: no se puede deshacer."
COM_USERTOOLS_TOUR_DELETE_WARNING_TITLE="Permanente"
COM_USERTOOLS_TOUR_DELETE_WARNING_DESC="Una cuenta eliminada no se puede recuperar. Si solo quieres impedir el acceso, bloquéala con «Revisar usuarios inactivos»."
COM_USERTOOLS_TOUR_DELETE_PERIOD_TITLE="Plazo y estado"
COM_USERTOOLS_TOUR_DELETE_PERIOD_DESC="Indica los días sin acceder y qué cuentas buscar. Por defecto, solo las ya bloqueadas, para que nadie pierda su cuenta sin haber pasado antes por un bloqueo."
COM_USERTOOLS_TOUR_DELETE_EXCLUSIONS_TITLE="Exclusiones"
COM_USERTOOLS_TOUR_DELETE_EXCLUSIONS_DESC="Cuentas y grupos que nunca se eliminan con esta herramienta. Los superusuarios y tu propia cuenta están siempre protegidos."
COM_USERTOOLS_TOUR_DELETE_ACTIONS_TITLE="Buscar y confirmar"
COM_USERTOOLS_TOUR_DELETE_ACTIONS_DESC="La búsqueda no elimina nada. En la revisión marcas las cuentas y escribes siempre su número para confirmar. Cada eliminación queda en el registro de acciones."
