COM_USERTOOLS_COMPARE_HOME_DESC="Pega la lista completa de quienes deben conservar acceso. Revisa las cuentas que se bloquearán y elige qué usuarios nuevos quieres crear. Las cuentas bloqueadas conservan sus datos."
