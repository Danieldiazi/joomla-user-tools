COM_USERTOOLS_DIAGNOSE_MISSING_LEVELS_WHY="Ninguna cuenta tiene ese nivel, así que nadie ve esos elementos en el sitio, y tampoco aparecen al filtrar por ningún nivel. Suele pasar al borrar un nivel directamente en la base de datos o al importar datos."
COM_USERTOOLS_DIAGNOSE_MISSING_LEVELS_HOW="Abre cada listado desde su enlace, ya filtrado por ese nivel, y asigna a los elementos un nivel que exista; en los listados que lo permiten, el proceso por lotes de Joomla cambia el nivel de varios a la vez. Las tablas de otras extensiones se cuentan sin enlace: revísalas en la propia extensión."
