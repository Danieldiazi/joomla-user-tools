COM_USERTOOLS_CONFIG_COMPARE_DESC="Exclusiones de la comparación manual. También se guardan al usarla."
COM_USERTOOLS_CONFIG_INACTIVE="Revisión de inactivos"
COM_USERTOOLS_CONFIG_INACTIVE_DESC="Plazo y exclusiones de la revisión manual por inactividad. También se guardan al usarla. Las tareas programadas tienen su propia configuración."

; Portada
COM_USERTOOLS_HOME_INTRO="Gestiona las cuentas y sus accesos. Las herramientas manuales te muestran los cambios para que los revises antes de aplicarlos."
