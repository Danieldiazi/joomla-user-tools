COM_USERTOOLS_TOUR_UNGROUP_TITLE="User Tools: quitar de grupos"
COM_USERTOOLS_TOUR_UNGROUP_DESC="Saca una cuenta de los grupos que elijas, y si quieres de sus subgrupos. Una cuenta cada vez."
COM_USERTOOLS_TOUR_UNGROUP_STEPS_TITLE="Cuatro pasos"
COM_USERTOOLS_TOUR_UNGROUP_STEPS_DESC="Eliges la cuenta, desmarcas los grupos que debe dejar, revisas el resultado y confirmas."
COM_USERTOOLS_TOUR_UNGROUP_ACCOUNT_TITLE="La cuenta"
COM_USERTOOLS_TOUR_UNGROUP_ACCOUNT_DESC="Escribe parte del usuario, el nombre o el correo y elige la cuenta en la lista. Si no eres superusuario, no podrás cambiar cuentas con acceso a la administración."
COM_USERTOOLS_TOUR_UNGROUP_ACTIONS_TITLE="Elegir los grupos"
COM_USERTOOLS_TOUR_UNGROUP_ACTIONS_DESC="En el paso siguiente verás solo sus grupos. Nada cambia hasta que confirmas; entonces se cierran sus sesiones y el cambio queda en el registro de acciones."
