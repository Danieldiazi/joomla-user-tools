COM_USERTOOLS_TOUR_SYNC_TITLE="User Tools: sincronizar un colectivo"
COM_USERTOOLS_TOUR_SYNC_DESC="Mantiene los grupos de una rama a partir de una lista, sin tocar otros grupos ni bloquear cuentas."
COM_USERTOOLS_TOUR_SYNC_RULES_TITLE="Protecciones"
COM_USERTOOLS_TOUR_SYNC_RULES_DESC="Nunca se añaden ni se quitan grupos con acceso a la administración, ni se modifican superusuarios, cuentas con acceso administrativo o tu propia cuenta. Nadie se bloquea por no estar en la lista."
COM_USERTOOLS_TOUR_SYNC_BRANCH_TITLE="Rama y tipo de lista"
COM_USERTOOLS_TOUR_SYNC_BRANCH_DESC="Elige el grupo principal: se gestionan él y sus subgrupos. Una actualización parcial solo toca a quien aparece; una lista completa propone también retirar los grupos de la rama a quien no aparece."
COM_USERTOOLS_TOUR_SYNC_LIST_TITLE="La lista"
COM_USERTOOLS_TOUR_SYNC_LIST_DESC="Una cuenta por línea: cuenta;grupos;correo;nombre. Identifica las cuentas por usuario o por ID, y los grupos por ID o ruta completa, separados con |."
COM_USERTOOLS_TOUR_SYNC_ACTIONS_TITLE="Revisar antes de aplicar"
COM_USERTOOLS_TOUR_SYNC_ACTIONS_DESC="La revisión muestra los grupos gestionados y, por cuenta, qué se crea, se añade, se quita o se mantiene, sin cambiar nada. Cada cambio cierra las sesiones de la cuenta y queda en el registro de acciones."
