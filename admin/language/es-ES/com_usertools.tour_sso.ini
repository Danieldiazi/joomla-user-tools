COM_USERTOOLS_TOUR_SSO_TITLE="User Tools: pasar cuentas a SSO"
COM_USERTOOLS_TOUR_SSO_DESC="Convierte cuentas con cambio forzado de contraseña a acceso SSO, rotando su contraseña local y cerrando sesiones."
COM_USERTOOLS_TOUR_SSO_RULES_TITLE="Rotar contraseña local, no eliminarla"
COM_USERTOOLS_TOUR_SSO_RULES_DESC="La conversión establece una contraseña aleatoria desconocida, desmarca el cambio obligatorio y cierra sesiones. No modifica grupos, bloqueo ni MFA. La recuperación de contraseñas del sitio podría permitir crear una contraseña local posterior."
COM_USERTOOLS_TOUR_SSO_FILTERS_TITLE="Filtrar las cuentas"
COM_USERTOOLS_TOUR_SSO_FILTERS_DESC="Filtra por grupo y subgrupos, estado de bloqueo y accesos anteriores. Solo aparecen cuentas con restablecimiento obligatorio; los superusuarios y tu propia cuenta están protegidos."
COM_USERTOOLS_TOUR_SSO_ACTIONS_TITLE="Revisar y seleccionar"
COM_USERTOOLS_TOUR_SSO_ACTIONS_DESC="Este botón solo prepara la revisión, sin cambios. Todas las cuentas llegan sin seleccionar; se exige confirmar y, para tandas grandes, escribir el número marcado."
