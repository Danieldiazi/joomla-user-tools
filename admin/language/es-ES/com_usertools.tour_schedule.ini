COM_USERTOOLS_TOUR_SCHEDULE_TITLE="User Tools: tarea programada"
COM_USERTOOLS_TOUR_SCHEDULE_DESC="Bloquea cada cierto tiempo, sin intervención, las cuentas que llevan un plazo sin acceder. Se configura en las Tareas programadas de Joomla."
COM_USERTOOLS_TOUR_SCHEDULE_STATE_TITLE="Estado del plugin"
COM_USERTOOLS_TOUR_SCHEDULE_STATE_DESC="La tarea necesita el plugin «Tarea - User Tools» habilitado. Este aviso dice si lo está."
COM_USERTOOLS_TOUR_SCHEDULE_INSTRUCTIONS_TITLE="Cómo configurarla"
COM_USERTOOLS_TOUR_SCHEDULE_INSTRUCTIONS_DESC="Sigue los pasos. Empieza con la simulación activada y revisa el informe antes de desactivarla. Si una ejecución supera el límite de seguridad, no bloquea ninguna cuenta."
