COM_USERTOOLS_TOUR_COMPARE_TITLE="User Tools: comparar una lista"
COM_USERTOOLS_TOUR_COMPARE_DESC="Bloquea las cuentas que ya no están en una lista vigente y da de alta, si quieres, los nombres nuevos. Nada cambia hasta que confirmas la revisión."
COM_USERTOOLS_TOUR_COMPARE_STEPS_TITLE="Tres pasos"
COM_USERTOOLS_TOUR_COMPARE_STEPS_DESC="Primero pegas la lista, después revisas qué se bloquearía y qué cuentas faltan, y por último ves el resultado. Puedes volver atrás sin cambiar nada."
COM_USERTOOLS_TOUR_COMPARE_LIST_TITLE="La lista vigente"
COM_USERTOOLS_TOUR_COMPARE_LIST_DESC="Pega la lista completa de nombres de usuario, uno por línea. Las cuentas que no estén en ella se propondrán para bloqueo, así que una lista incompleta llevaría a bloqueos incorrectos."
COM_USERTOOLS_TOUR_COMPARE_EXCLUSIONS_TITLE="Exclusiones"
COM_USERTOOLS_TOUR_COMPARE_EXCLUSIONS_DESC="Cuentas y grupos que nunca se bloquean con esta herramienta. Los superusuarios y tu propia cuenta están siempre protegidos, aunque no los marques."
COM_USERTOOLS_TOUR_COMPARE_ACTIONS_TITLE="Revisar antes de aplicar"
COM_USERTOOLS_TOUR_COMPARE_ACTIONS_DESC="«Siguiente: revisar cambios» solo prepara la revisión. Ninguna cuenta se marca inicialmente para bloqueo: selecciona las que correspondan, incluso filtrando la lista. El número tecleado a partir del umbral de Opciones cuenta solo los bloqueos seleccionados. Las no seleccionadas siguen activas y las altas se revisan por separado."
