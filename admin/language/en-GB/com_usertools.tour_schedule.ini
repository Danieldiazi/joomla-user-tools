COM_USERTOOLS_TOUR_SCHEDULE_TITLE="User Tools: scheduled task"
COM_USERTOOLS_TOUR_SCHEDULE_DESC="Regularly blocks, unattended, the accounts that have not signed in for a period. It is set up in Joomla's Scheduled Tasks."
COM_USERTOOLS_TOUR_SCHEDULE_STATE_TITLE="Plugin status"
COM_USERTOOLS_TOUR_SCHEDULE_STATE_DESC="The task needs the “Task - User Tools” plugin enabled. This notice says whether it is."
COM_USERTOOLS_TOUR_SCHEDULE_INSTRUCTIONS_TITLE="How to set it up"
COM_USERTOOLS_TOUR_SCHEDULE_INSTRUCTIONS_DESC="Follow the steps. Start with the dry run enabled and check the report before turning it off. If a run exceeds the safety limit, it blocks no account."
