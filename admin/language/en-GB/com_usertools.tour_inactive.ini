COM_USERTOOLS_TOUR_INACTIVE_TITLE="User Tools: review inactive users"
COM_USERTOOLS_TOUR_INACTIVE_DESC="Finds the accounts that have not signed in for a while and blocks the ones you choose. They can be unblocked later with “Undo blocks”."
COM_USERTOOLS_TOUR_INACTIVE_STEPS_TITLE="Three steps"
COM_USERTOOLS_TOUR_INACTIVE_STEPS_DESC="You set the period, choose the accounts in the review and see the result. Searching changes nothing."
COM_USERTOOLS_TOUR_INACTIVE_PERIOD_TITLE="Period without signing in"
COM_USERTOOLS_TOUR_INACTIVE_PERIOD_DESC="Number of days since the last sign-in. Tick the box if you also want to include accounts that have never signed in."
COM_USERTOOLS_TOUR_INACTIVE_EXCLUSIONS_TITLE="Exclusions"
COM_USERTOOLS_TOUR_INACTIVE_EXCLUSIONS_DESC="This tool has its own exclusions. Super Users and your own account are always protected."
COM_USERTOOLS_TOUR_INACTIVE_ACTIONS_TITLE="Search and review"
COM_USERTOOLS_TOUR_INACTIVE_ACTIONS_DESC="The search lists the candidates so you can tick which ones to block. From the threshold set in Options you must type the number of accounts. Each block ends the account's sessions and is written to the actions log."
