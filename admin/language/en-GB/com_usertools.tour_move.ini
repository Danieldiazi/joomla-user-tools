COM_USERTOOLS_TOUR_MOVE_TITLE="User Tools: move groups"
COM_USERTOOLS_TOUR_MOVE_DESC="Changes the parent of several groups at once, with all their subgroups and members. Super Users only."
COM_USERTOOLS_TOUR_MOVE_RULES_TITLE="What is inherited"
COM_USERTOOLS_TOUR_MOVE_RULES_DESC="When its parent changes, a group inherits other permissions and access levels. Moves that would change administrator access or Super User permissions are refused."
COM_USERTOOLS_TOUR_MOVE_GROUPS_TITLE="Groups to move"
COM_USERTOOLS_TOUR_MOVE_GROUPS_DESC="Tick the groups. Each one moves with its subgroups; the root and Super User groups cannot be moved."
COM_USERTOOLS_TOUR_MOVE_TARGET_TITLE="New parent"
COM_USERTOOLS_TOUR_MOVE_TARGET_DESC="The group the ticked groups will hang from."
COM_USERTOOLS_TOUR_MOVE_ACTIONS_TITLE="Review before moving"
COM_USERTOOLS_TOUR_MOVE_ACTIONS_DESC="The review shows the access levels each group gains and loses, without changing anything. Each move is written to the actions log."
