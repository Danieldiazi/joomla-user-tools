COM_USERTOOLS_TOUR_UNBLOCK_TITLE="User Tools: undo blocks"
COM_USERTOOLS_TOUR_UNBLOCK_DESC="Unblocks the accounts of a batch of blocks: a scheduled task run or a manual review. Before anything changes you will see which accounts can be unblocked."
COM_USERTOOLS_TOUR_UNBLOCK_STEPS_TITLE="Three steps"
COM_USERTOOLS_TOUR_UNBLOCK_STEPS_DESC="You choose the batch, review its accounts and see the result."
COM_USERTOOLS_TOUR_UNBLOCK_RULES_TITLE="Which accounts are offered"
COM_USERTOOLS_TOUR_UNBLOCK_RULES_DESC="Only those that are still blocked and have not changed since the batch. If you are not a Super User, you cannot unblock accounts with administrator access."
COM_USERTOOLS_TOUR_UNBLOCK_BATCHES_TITLE="Recent batches"
COM_USERTOOLS_TOUR_UNBLOCK_BATCHES_DESC="Select “Review” on a batch to see its accounts. Reviewing unblocks nothing: you do that afterwards, choosing the accounts and confirming."
