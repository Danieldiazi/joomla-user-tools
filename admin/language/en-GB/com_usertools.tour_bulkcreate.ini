COM_USERTOOLS_TOUR_BULKCREATE_TITLE="User Tools: bulk account creation"
COM_USERTOOLS_TOUR_BULKCREATE_DESC="Create accounts from usernames, with optional name, email and group. Existing accounts are never changed or blocked."
COM_USERTOOLS_TOUR_BULKCREATE_RULES_TITLE="Only creates new accounts"
COM_USERTOOLS_TOUR_BULKCREATE_RULES_DESC="Choose which accounts to create in the review. Missing accounts are never blocked and existing accounts are skipped."
COM_USERTOOLS_TOUR_BULKCREATE_LIST_TITLE="Enter accounts"
COM_USERTOOLS_TOUR_BULKCREATE_LIST_DESC="One row per account: username;name;email;group. Only username is required. In review, missing name becomes username, group defaults to Registered, and email can be entered or generated with a domain."
COM_USERTOOLS_TOUR_BULKCREATE_ACTIONS_TITLE="Review before applying"
COM_USERTOOLS_TOUR_BULKCREATE_ACTIONS_DESC="This button starts the review without changes. You can select rows, verify email addresses and choose email link, temporary password or SSO mode."
