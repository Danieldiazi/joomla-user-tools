COM_USERTOOLS_TOUR_SYNC_TITLE="User Tools: synchronise a group branch"
COM_USERTOOLS_TOUR_SYNC_DESC="Keeps the groups of one branch in line with a list, without touching other groups or blocking accounts."
COM_USERTOOLS_TOUR_SYNC_RULES_TITLE="Protection"
COM_USERTOOLS_TOUR_SYNC_RULES_DESC="Groups with administrator access are never added or removed, and Super Users, accounts with administrator access and your own account are never changed. Nobody is blocked for not being on the list."
COM_USERTOOLS_TOUR_SYNC_BRANCH_TITLE="Branch and type of list"
COM_USERTOOLS_TOUR_SYNC_BRANCH_DESC="Choose the top group: it and its subgroups are managed. A partial update only touches who is listed; a complete list also proposes removing the groups of the branch from anyone not listed."
COM_USERTOOLS_TOUR_SYNC_LIST_TITLE="The list"
COM_USERTOOLS_TOUR_SYNC_LIST_DESC="One account per line: account;groups;email;name. Identify accounts by username or ID, and groups by ID or full path, separated with |."
COM_USERTOOLS_TOUR_SYNC_ACTIONS_TITLE="Review before applying"
COM_USERTOOLS_TOUR_SYNC_ACTIONS_DESC="The review shows the managed groups and, per account, what is created, added, removed or kept, without changing anything. Each change closes the account's sessions and is written to the User Actions Log."
