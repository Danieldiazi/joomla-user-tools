COM_USERTOOLS_TOUR_DELETE_TITLE="User Tools: delete inactive users"
COM_USERTOOLS_TOUR_DELETE_DESC="Deletes the inactive accounts you choose. It is permanent: it cannot be undone."
COM_USERTOOLS_TOUR_DELETE_WARNING_TITLE="Permanent"
COM_USERTOOLS_TOUR_DELETE_WARNING_DESC="A deleted account cannot be recovered. If you only want to stop access, block it with “Review inactive users”."
COM_USERTOOLS_TOUR_DELETE_PERIOD_TITLE="Period and status"
COM_USERTOOLS_TOUR_DELETE_PERIOD_DESC="Set the days without signing in and which accounts to search. By default, only accounts that are already blocked, so nobody loses an account without being blocked first."
COM_USERTOOLS_TOUR_DELETE_EXCLUSIONS_TITLE="Exclusions"
COM_USERTOOLS_TOUR_DELETE_EXCLUSIONS_DESC="Accounts and groups this tool never deletes. Super Users and your own account are always protected."
COM_USERTOOLS_TOUR_DELETE_ACTIONS_TITLE="Search and confirm"
COM_USERTOOLS_TOUR_DELETE_ACTIONS_DESC="Searching deletes nothing. In the review you tick the accounts and always type their number to confirm. Each deletion is written to the actions log."
