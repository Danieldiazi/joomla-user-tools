COM_USERTOOLS_TOUR_ANONYMIZE_TITLE="User Tools: anonymise accounts"
COM_USERTOOLS_TOUR_ANONYMIZE_DESC="Replaces the personal data of the accounts you choose without deleting them, so their content is kept. It is permanent."
COM_USERTOOLS_TOUR_ANONYMIZE_WARNING_TITLE="What changes"
COM_USERTOOLS_TOUR_ANONYMIZE_WARNING_DESC="Read which data is replaced and which is kept. It cannot be undone."
COM_USERTOOLS_TOUR_ANONYMIZE_SOURCE_TITLE="Choosing the accounts"
COM_USERTOOLS_TOUR_ANONYMIZE_SOURCE_DESC="Choose one way: a list of usernames, the accounts that have not signed in for a period or the members of a group."
COM_USERTOOLS_TOUR_ANONYMIZE_EXCLUSIONS_TITLE="Exclusions"
COM_USERTOOLS_TOUR_ANONYMIZE_EXCLUSIONS_DESC="Accounts and groups this tool never anonymises. Super Users and your own account are always protected."
COM_USERTOOLS_TOUR_ANONYMIZE_ACTIONS_TITLE="Search and confirm"
COM_USERTOOLS_TOUR_ANONYMIZE_ACTIONS_DESC="Searching changes nothing. In the review you tick the accounts and always type their number to confirm. Each anonymisation ends the account's sessions and is written to the actions log."
