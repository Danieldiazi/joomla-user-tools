COM_USERTOOLS_DIAGNOSE_EMPTY_GROUPS_WHY="This is not usually a problem: Joomla ships groups such as Author, Editor or Publisher that many sites do not use. It helps find groups that are no longer needed. Public and the guest group are left out, because they never have members."
COM_USERTOOLS_DIAGNOSE_EMPTY_GROUPS_HOW="Before deleting a group, check that no component's permissions and no access level use it, and review its subgroups too."
