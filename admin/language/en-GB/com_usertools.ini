COM_USERTOOLS_COMPARE_TITLE="Compare a list of users"
COM_USERTOOLS_COMPARE_HOME_DESC="Paste the full list of people who must keep access. Review the accounts that will be blocked and choose which new users to create. Blocked accounts keep their data."
