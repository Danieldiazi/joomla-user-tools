COM_USERTOOLS_DIAGNOSE_MISSING_LEVELS_HOW="Open each list from its link, already filtered by that level, and give the items a level that exists; in lists that allow it, Joomla's batch processing changes the level of several at once. Tables of other extensions are counted without a link: review them in the extension itself."
