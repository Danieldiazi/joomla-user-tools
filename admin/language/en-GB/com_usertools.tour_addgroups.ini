COM_USERTOOLS_TOUR_ADDGROUPS_TITLE="User Tools: add accounts to groups"
COM_USERTOOLS_TOUR_ADDGROUPS_DESC="Adds existing accounts to one or more groups without removing them from the groups they already have."
COM_USERTOOLS_TOUR_ADDGROUPS_RULES_TITLE="Safeguards"
COM_USERTOOLS_TOUR_ADDGROUPS_RULES_DESC="Groups with administrator access are never assigned, and Super Users, accounts with administrator access and your own account are never changed."
COM_USERTOOLS_TOUR_ADDGROUPS_ACCOUNTS_TITLE="Accounts and groups"
COM_USERTOOLS_TOUR_ADDGROUPS_ACCOUNTS_DESC="Choose one group for the whole list or write user;group pairs, one per line. The group is given by its ID or full path."
COM_USERTOOLS_TOUR_ADDGROUPS_ACTIONS_TITLE="Review before applying"
COM_USERTOOLS_TOUR_ADDGROUPS_ACTIONS_DESC="The review shows what will be added and what is rejected, without changing anything. Each membership added ends the account's sessions and is written to the actions log."
