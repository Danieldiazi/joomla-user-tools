COM_USERTOOLS_TOUR_UNGROUP_TITLE="User Tools: remove from groups"
COM_USERTOOLS_TOUR_UNGROUP_DESC="Removes one account from the groups you choose and, if you want, from their subgroups. One account at a time."
COM_USERTOOLS_TOUR_UNGROUP_STEPS_TITLE="Four steps"
COM_USERTOOLS_TOUR_UNGROUP_STEPS_DESC="You choose the account, untick the groups it should leave, review the outcome and confirm."
COM_USERTOOLS_TOUR_UNGROUP_ACCOUNT_TITLE="The account"
COM_USERTOOLS_TOUR_UNGROUP_ACCOUNT_DESC="Type part of the username, name or email and pick the account from the list. If you are not a Super User, you cannot change accounts with administrator access."
COM_USERTOOLS_TOUR_UNGROUP_ACTIONS_TITLE="Choosing the groups"
COM_USERTOOLS_TOUR_UNGROUP_ACTIONS_DESC="In the next step you will see only its groups. Nothing changes until you confirm; then its sessions are ended and the change is written to the actions log."
