COM_USERTOOLS_TOUR_SSO_TITLE="User Tools: convert accounts to SSO"
COM_USERTOOLS_TOUR_SSO_DESC="Converts accounts that require a password reset to SSO credentials, rotating the local password and closing sessions."
COM_USERTOOLS_TOUR_SSO_RULES_TITLE="Rotate the local password, do not remove it"
COM_USERTOOLS_TOUR_SSO_RULES_DESC="This tool assigns an undisclosed random password, clears mandatory reset and closes sessions. Groups, blocking and MFA are unchanged. Site password recovery might allow a local password to be set later."
COM_USERTOOLS_TOUR_SSO_FILTERS_TITLE="Filter accounts"
COM_USERTOOLS_TOUR_SSO_FILTERS_DESC="Filter by group and descendants, blocking state and previous login. Only forced-reset accounts are offered; Super Users and your own account are protected."
COM_USERTOOLS_TOUR_SSO_ACTIONS_TITLE="Review and select"
COM_USERTOOLS_TOUR_SSO_ACTIONS_DESC="This button only prepares the review. All accounts start unselected, require confirmation and a typed count for large selections."
