COM_USERTOOLS_TOUR_COMPARE_TITLE="User Tools: compare a list"
COM_USERTOOLS_TOUR_COMPARE_DESC="Blocks the accounts that are no longer on a current list and, if you want, creates the new names. Nothing changes until you confirm the review."
COM_USERTOOLS_TOUR_COMPARE_STEPS_TITLE="Three steps"
COM_USERTOOLS_TOUR_COMPARE_STEPS_DESC="First you paste the list, then you review what would be blocked and which accounts are missing, and finally you see the result. You can go back without changing anything."
COM_USERTOOLS_TOUR_COMPARE_LIST_TITLE="The current list"
COM_USERTOOLS_TOUR_COMPARE_LIST_DESC="Paste the complete list of usernames, one per line. Accounts that are not on it will be proposed for blocking, so an incomplete list would lead to wrong blocks."
COM_USERTOOLS_TOUR_COMPARE_EXCLUSIONS_TITLE="Exclusions"
COM_USERTOOLS_TOUR_COMPARE_EXCLUSIONS_DESC="Accounts and groups this tool never blocks. Super Users and your own account are always protected, even if you do not tick them."
COM_USERTOOLS_TOUR_COMPARE_ACTIONS_TITLE="Review before applying"
COM_USERTOOLS_TOUR_COMPARE_ACTIONS_DESC="“Next: review changes” only prepares the review. There you choose what is blocked and what is created; from the threshold set in Options you must type the number of accounts to confirm. Each block ends the account's sessions and is written to the actions log."
