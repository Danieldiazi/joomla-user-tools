name: Build and release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The changelog needs the previous tag and the merges since it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a release tag such as v2026.10.3.' >&2
            exit 1
          fi
          # The tag must match the version in the manifests, so a release never ships code
          # prepared for another version (v2026.10.14 was tagged on 2026.10.15 code).
          manifest=$(php -r 'echo (string) simplexml_load_file("com_usertools.xml")->version;')
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the manifest version $manifest. Tag the commit that sets that version." >&2
            exit 1
          fi

      - name: Tests
        run: |
          composer install --no-interaction --no-progress
          npm ci --no-audit --no-fund
          find admin plugins modules package scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          vendor/bin/phpunit
          npm test

      - name: Collect the pull requests of this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Previous release tag reachable from this one; none for the first release.
          previous=$(git describe --tags --abbrev=0 --match 'v20*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="$GITHUB_REF_NAME"
          if [ -n "$previous" ]; then range="$previous..$GITHUB_REF_NAME"; fi
          # Pull requests are merged with merge commits on main.
          numbers=$(git log --first-parent --format=%s "$range" | sed -n 's/^Merge pull request #\([0-9]*\) .*/\1/p' | sort -n)
          for number in $numbers; do
            gh api "repos/$GH_REPO/pulls/$number" --jq '{number, title, body, labels: [.labels[].name]}'
          done | jq -s . > pulls.json
          rm -f previous-changelog.xml
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern changelog.xml --output previous-changelog.xml || true
          fi
          echo "Changelog since ${previous:-the first commit}: $(jq length pulls.json) pull requests"

      - name: Build and verify installable packages
        run: |
          php scripts/build.php --version="$GITHUB_REF_NAME" --output=dist
          php scripts/changelog.php "$GITHUB_REF_NAME" pulls.json previous-changelog.xml > dist/changelog.xml
          php tests/verify-build.php "$GITHUB_REF_NAME" dist --changelog

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=("dist/pkg_usertools-$version.zip" "dist/com_usertools-$version.zip" "dist/plg_task_usertools-$version.zip" "dist/plg_system_usertools-$version.zip" "dist/mod_usertools-$version.zip" "dist/mod_usertools_groups-$version.zip" dist/SHA256SUMS.txt dist/updates.xml dist/changelog.xml)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "User Tools $version" --generate-notes
          fi
