name: Build and release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate tag
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Use a release tag such as v0.2.1.'
          }

      - name: Check PHP syntax and run tests
        run: |
          Get-ChildItem admin,plugins,tests -Filter *.php -Recurse | ForEach-Object {
            php -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "PHP syntax check failed: $($_.FullName)" }
          }
          foreach ($test in @('tests/comparison.php', 'tests/policies.php', 'tests/task.php')) {
            php $test
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }

      - name: Build installable packages
        run: |
          ./scripts/build.ps1 -Version $env:GITHUB_REF_NAME -OutputDirectory ./dist

      - name: Verify package versions and contents
        run: |
          ./tests/build.ps1 -Version $env:GITHUB_REF_NAME -PackageDirectory ./dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assets = @(
            "dist/pkg_usertools-$version.zip",
            "dist/com_usertools-$version.zip",
            "dist/plg_task_usertools-$version.zip",
            'dist/SHA256SUMS.txt'
          )
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "User Tools $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release assets.' }
