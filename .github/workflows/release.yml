name: Build and release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a release tag such as v2026.10.3.' >&2
            exit 1
          fi

      - name: Tests
        run: |
          composer install --no-interaction --no-progress
          npm ci --no-audit --no-fund
          find admin plugins modules package scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          vendor/bin/phpunit
          npm test

      - name: Build and verify installable packages
        run: |
          php scripts/build.php --version="$GITHUB_REF_NAME" --output=dist
          php tests/verify-build.php "$GITHUB_REF_NAME" dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=("dist/pkg_usertools-$version.zip" "dist/com_usertools-$version.zip" "dist/plg_task_usertools-$version.zip" "dist/mod_usertools-$version.zip" "dist/mod_usertools_groups-$version.zip" dist/SHA256SUMS.txt dist/updates.xml)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "User Tools $version" --generate-notes
          fi
