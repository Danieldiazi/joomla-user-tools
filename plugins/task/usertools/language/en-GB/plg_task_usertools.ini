PLG_TASK_USERTOOLS="Task - User Tools"
PLG_TASK_USERTOOLS_XML_DESCRIPTION="Blocks accounts for inactivity, with exclusions of its own and a safety limit. Requires the User Tools component 2026.10.3 or later."
PLG_TASK_USERTOOLS_BLOCK_TITLE="User Tools: block inactive users"
PLG_TASK_USERTOOLS_BLOCK_DESC="Blocks the accounts whose last visit is older than the configured period. It never deletes or re-enables accounts."
PLG_TASK_USERTOOLS_DRY_RUN="Dry run (no blocking)"
PLG_TASK_USERTOOLS_DRY_RUN_DESC="Enabled by default. Writes the report with the accounts that would be blocked, without changing any. Disable it when the result is right."
PLG_TASK_USERTOOLS_DAYS="Inactivity period (days)"
PLG_TASK_USERTOOLS_DAYS_DESC="365 days by default. Accounts whose last visit is before the cut-off date, calculated in UTC, are blocked."
PLG_TASK_USERTOOLS_NEVER="Include users who never logged in"
PLG_TASK_USERTOOLS_NEVER_DESC="Disabled by default. If enabled, the period counts from the registration date for these accounts."
PLG_TASK_USERTOOLS_EXCLUSIONS="Exclusions of this task"
PLG_TASK_USERTOOLS_EXCLUSIONS_DESC="Independent from the manual tools and from other tasks. Super Users are always protected."
PLG_TASK_USERTOOLS_PROTECT_ADMINS="Exclude administrators"
PLG_TASK_USERTOOLS_PROTECT_ADMINS_DESC="Protects every account with administrator access. Super Users are protected even if disabled."
PLG_TASK_USERTOOLS_NAMES="Excluded usernames"
PLG_TASK_USERTOOLS_NAMES_DESC="One username per line. Case-insensitive."
PLG_TASK_USERTOOLS_GROUPS="Excluded groups"
PLG_TASK_USERTOOLS_GROUPS_DESC="Their subgroups are protected too."
PLG_TASK_USERTOOLS_GUARD="Safety limit against mass blocking"
PLG_TASK_USERTOOLS_GUARD_DESC="If a run would block more than this share of the active accounts, it blocks none: the run is shown as «Stopped for safety» in Task results and the task ends with an error so that you see it in the history. A wrong setting or wrong access dates cannot lock almost all your users out. In dry runs it only warns in the report. Example with the default values (20% and 10 accounts): on a site with 1,000 active accounts the task stops above 200 candidates; with 30 active accounts, 7 candidates (23%) do not stop it because they are below the minimum of 10."
PLG_TASK_USERTOOLS_GUARD_PERCENT="Maximum share of active accounts (%)"
PLG_TASK_USERTOOLS_GUARD_PERCENT_DESC="The run stops if the candidates exceed this share of the accounts that are not blocked. 20 by default. 0 or 100 disable the limit."
PLG_TASK_USERTOOLS_GUARD_MINIMUM="Apply from (candidates)"
PLG_TASK_USERTOOLS_GUARD_MINIMUM_DESC="The limit is only checked from this number of candidates on, so that a few accounts do not stop the task on small sites. 10 by default."
