PLG_TASK_USERTOOLS="Task - User Tools"
PLG_TASK_USERTOOLS_XML_DESCRIPTION="Blocks inactive accounts using independent exclusions. Requires User Tools component 0.2.0 or later."
PLG_TASK_USERTOOLS_BLOCK_TITLE="User Tools: block inactive users"
PLG_TASK_USERTOOLS_BLOCK_DESC="Blocks accounts whose last visit is older than the configured period. Never deletes or reactivates accounts."
PLG_TASK_USERTOOLS_DAYS="Inactivity period (days)"
PLG_TASK_USERTOOLS_DAYS_DESC="Defaults to 365 days. Dates must be strictly older than the UTC cutoff."
PLG_TASK_USERTOOLS_PROTECT_ADMINS="Exclude administrators"
PLG_TASK_USERTOOLS_PROTECT_ADMINS_DESC="Protects super users and all accounts allowed to access the administrator application."
PLG_TASK_USERTOOLS_NAMES="Excluded usernames"
PLG_TASK_USERTOOLS_NAMES_DESC="One username per line, case-insensitive. Independent from the manual comparison exclusions."
PLG_TASK_USERTOOLS_GROUPS="Excluded groups"
PLG_TASK_USERTOOLS_GROUPS_DESC="Select multiple groups. Descendant groups are protected as well."
PLG_TASK_USERTOOLS_NEVER="Include users who never logged in"
PLG_TASK_USERTOOLS_NEVER_DESC="Disabled by default. When enabled, uses the registration date for these accounts."
PLG_TASK_USERTOOLS_DRY_RUN="Dry run (no blocking)"
PLG_TASK_USERTOOLS_DRY_RUN_DESC="Enabled by default. Logs candidate IDs without changing accounts. Disable to apply blocks."
