PLG_TASK_USERTOOLS="Tarea - User Tools"
PLG_TASK_USERTOOLS_XML_DESCRIPTION="Bloquea cuentas por inactividad con exclusiones propias. Requiere el componente User Tools 0.2.0 o posterior."
PLG_TASK_USERTOOLS_BLOCK_TITLE="User Tools: bloquear usuarios inactivos"
PLG_TASK_USERTOOLS_BLOCK_DESC="Bloquea cuentas cuyo último acceso supera el plazo configurado. No elimina ni reactiva cuentas."
PLG_TASK_USERTOOLS_DAYS="Periodo de inactividad (días)"
PLG_TASK_USERTOOLS_DAYS_DESC="365 días por defecto. Solo afecta a fechas anteriores al límite, calculado en UTC."
PLG_TASK_USERTOOLS_PROTECT_ADMINS="Excluir administradores"
PLG_TASK_USERTOOLS_PROTECT_ADMINS_DESC="Protege a superusuarios y a todas las cuentas con permiso para entrar en la administración."
PLG_TASK_USERTOOLS_NAMES="Nombres de usuario excluidos"
PLG_TASK_USERTOOLS_NAMES_DESC="Un nombre por línea. No se distinguen mayúsculas y minúsculas. Exclusiones independientes de la comparación manual."
PLG_TASK_USERTOOLS_GROUPS="Grupos excluidos"
PLG_TASK_USERTOOLS_GROUPS_DESC="Permite seleccionar varios grupos. También se protegen sus subgrupos."
PLG_TASK_USERTOOLS_NEVER="Incluir usuarios que nunca han accedido"
PLG_TASK_USERTOOLS_NEVER_DESC="Desactivado por defecto. Si se activa, aplica el plazo desde la fecha de registro a estas cuentas."
PLG_TASK_USERTOOLS_DRY_RUN="Simulación (sin bloquear)"
PLG_TASK_USERTOOLS_DRY_RUN_DESC="Activada por defecto. Registra los IDs candidatos sin modificar cuentas. Desactívala para aplicar los bloqueos."
