PLG_TASK_USERTOOLS="Tarea - User Tools"
PLG_TASK_USERTOOLS_XML_DESCRIPTION="Bloquea cuentas por inactividad, con exclusiones propias y un límite de seguridad. Requiere el componente User Tools 2026.10.3 o posterior."
PLG_TASK_USERTOOLS_BLOCK_TITLE="User Tools: bloquear usuarios inactivos"
PLG_TASK_USERTOOLS_BLOCK_DESC="Bloquea las cuentas cuyo último acceso supera el plazo configurado. No elimina ni reactiva cuentas."
PLG_TASK_USERTOOLS_DRY_RUN="Simulación (sin bloquear)"
PLG_TASK_USERTOOLS_DRY_RUN_DESC="Activada por defecto. Genera el informe con las cuentas que se bloquearían, sin modificar ninguna. Desactívala cuando el resultado sea correcto."
PLG_TASK_USERTOOLS_DAYS="Periodo de inactividad (días)"
PLG_TASK_USERTOOLS_DAYS_DESC="365 días por defecto. Se bloquean las cuentas cuyo último acceso es anterior a la fecha límite, calculada en UTC."
PLG_TASK_USERTOOLS_NEVER="Incluir usuarios que nunca han accedido"
PLG_TASK_USERTOOLS_NEVER_DESC="Desactivado por defecto. Si se activa, a estas cuentas se les aplica el plazo desde la fecha de registro."
PLG_TASK_USERTOOLS_EXCLUSIONS="Exclusiones de esta tarea"
PLG_TASK_USERTOOLS_EXCLUSIONS_DESC="Son independientes de las herramientas manuales y de otras tareas. Los superusuarios están siempre protegidos."
PLG_TASK_USERTOOLS_PROTECT_ADMINS="Excluir administradores"
PLG_TASK_USERTOOLS_PROTECT_ADMINS_DESC="Protege todas las cuentas con acceso a la administración. Los superusuarios están protegidos aunque se desactive."
PLG_TASK_USERTOOLS_NAMES="Nombres de usuario excluidos"
PLG_TASK_USERTOOLS_NAMES_DESC="Un nombre por línea. No se distinguen mayúsculas y minúsculas."
PLG_TASK_USERTOOLS_GROUPS="Grupos excluidos"
PLG_TASK_USERTOOLS_GROUPS_DESC="Se protegen también sus subgrupos."
PLG_TASK_USERTOOLS_GUARD="Límite de seguridad contra bloqueos masivos"
PLG_TASK_USERTOOLS_GUARD_DESC="Si una ejecución fuera a bloquear más del porcentaje indicado de las cuentas activas, no bloquea ninguna: la ejecución queda como «Detenida por seguridad» en Resultados de tareas y la tarea termina con error para que lo veas en el historial. Así una configuración equivocada o unas fechas de acceso incorrectas no pueden dejar a casi todos tus usuarios sin acceso. En simulación solo se avisa en el informe. Ejemplo con los valores por defecto (20 % y 10 cuentas): en una web con 1.000 cuentas activas, la tarea se detiene si encuentra más de 200 candidatos; con 30 cuentas activas, 7 candidatos (23 %) no la detienen porque no llegan al mínimo de 10."
PLG_TASK_USERTOOLS_GUARD_PERCENT="Porcentaje máximo de cuentas activas"
PLG_TASK_USERTOOLS_GUARD_PERCENT_DESC="La ejecución se detiene si los candidatos superan este porcentaje de las cuentas no bloqueadas. 20 por defecto. 0 o 100 desactivan el límite."
PLG_TASK_USERTOOLS_GUARD_MINIMUM="Aplicar a partir de (candidatos)"
PLG_TASK_USERTOOLS_GUARD_MINIMUM_DESC="El límite solo se comprueba si hay al menos este número de candidatos, para que en webs pequeñas unas pocas cuentas no detengan la tarea. 10 por defecto."
